<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo de Bandas - Folha 5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .item {
            background-color: #f9f9f9;
            border: 2px solid #ddd;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .item:hover {
            background-color: #e8e8ff;
            border-color: #666;
        }
        @media print {
            body {
                background-color: white;
            }
            .container {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bingo de Bandas - Folha 5</h1>
        <div class="grid">
            <div class="item">Skank</div>
            <div class="item">Legião Urbana</div>
            <div class="item">Capital Inicial</div>
            <div class="item">O Trem da História</div>
            <div class="item">Led Zeppelin</div>
            <div class="item">Queen</div>
            <div class="item">Paralamas do Sucesso</div>
            <div class="item">Sepultura</div>
            <div class="item">The Rolling Stones</div>
            <div class="item">Titãs</div>
            <div class="item">Raul Seixas</div>
            <div class="item">The Who</div>
            <div class="item">The Beatles</div>
            <div class="item">Angra</div>
            <div class="item">Guns N' Roses</div>
        </div>
    </div>
</body>
</html>
